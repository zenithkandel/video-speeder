[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-speeder"
version = "1.0.0"
description = "A professional, high-performance CLI tool to speed up or slow down videos locally using FFmpeg"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Zenith Kandel"}
]
keywords = ["video", "speeder", "ffmpeg", "cli", "speed-up", "slow-motion", "video-processing", "batch-processing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
video-speeder = "video_speeder.cli:main"
vspeed = "video_speeder.cli:main"

[tool.setuptools.packages.find]
include = ["video_speeder*"]
